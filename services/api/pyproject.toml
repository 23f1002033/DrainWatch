[project]
name = "drainwatch-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "moto[dynamodb,s3]>=5",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
